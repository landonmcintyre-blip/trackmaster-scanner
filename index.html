<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>TrackMaster Scanner</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>

<body>
  <main class="scanner-page">
    
<div id="active-drop">
  Active Drop: <span id="drop-id">Not provided</span>
</div>
    
    <section class="scanner-window">
      <video id="camera" playsinline></video>
          </section>

    <div id="status" class="status">
      Press Start Scanner
    </div>

    <button id="start-button" type="button">
      Start Scanner
    </button>
<!-- TEMPORARY TEST RESET BUTTON -->
<button
  id="test-reset-button"
  type="button"
  style="
    width: 100%;
    margin-top: 12px;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: #b3261e;
    color: white;
    font-weight: 700;
  "
>
  TEST: Reset This Drop
</button>
<!-- END TEMPORARY TEST RESET BUTTON -->
    <section class="results">
      <h2>Last scanned carton</h2>
      <div id="scan-result">None</div>

      <h2>Scan count</h2>
      <div id="scan-count">0</div>
      <div id="remaining-count">0 cartons remaining</div>
    </section>
  </main>

  <script src="scanner.js?v=15"></script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(error => {
          console.error(
            "Service worker registration failed:",
            error
          );
        });
    });
  }
</script>
</body>
</html>
